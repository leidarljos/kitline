name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the pinned toolchain
        id: pin
        run: |
          set -eu
          : "${GITHUB_OUTPUT:?}"
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}

      # ring (via deedar) compiles C, so cc-rs gets musl-gcc for the target.
      # rustc links the musl target. ubuntu-22.04 ships musl 1.2.2, whose
      # *link spec is `-dynamic-linker` and `%{static:-static}`.
      - name: musl C toolchain (C compiler only; rustc links itself)
        if: runner.os == 'Linux'
        run: |
          set -eu
          : "${GITHUB_ENV:?}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
          lower=$(printf '%s' "$TARGET" | tr '-' '_')
          echo "CC_${lower}=musl-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -eu
          : "${RUNNER_TEMP:?}"
          cargo build --locked --release --target "$TARGET" -p kitline
          install -m 0755 "target/${TARGET}/release/kitline" "$RUNNER_TEMP/kitline-${TARGET}"

      # `!` is exempt from `set -e`, so a match has to `exit 1` itself.
      - name: Linux asset is static and runs on this glibc runner
        if: runner.os == 'Linux'
        run: |
          set -eu
          b="$RUNNER_TEMP/kitline-${TARGET}"
          file "$b"
          file "$b" | grep -Eq 'static-pie linked|statically linked'
          hdr=$(readelf -lW "$b")
          dyn=$(readelf -dW "$b")
          case "$hdr" in
            *'Requesting program interpreter'*)
              printf '%s\n' "INTERP" >&2
              exit 1
              ;;
          esac
          case "$dyn" in
            *'(NEEDED)'*)
              printf '%s\n' "NEEDED" >&2
              exit 1
              ;;
          esac
          "$b" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/kitline-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS and install.sh
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          grep -qx "PIN=$channel" install.sh
          cp install.sh dist/install.sh
          chmod 0755 dist/install.sh
          cd dist
          test -f kitline-x86_64-unknown-linux-musl
          test -f kitline-aarch64-unknown-linux-musl
          test -f kitline-x86_64-apple-darwin
          test -f kitline-aarch64-apple-darwin
          sha256sum \
            kitline-aarch64-apple-darwin \
            kitline-aarch64-unknown-linux-musl \
            kitline-x86_64-apple-darwin \
            kitline-x86_64-unknown-linux-musl \
            install.sh \
            > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          files: |
            dist/kitline-*
            dist/install.sh
            dist/SHA256SUMS

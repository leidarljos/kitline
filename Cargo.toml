[workspace]
resolver = "2"
members = [".", "crates/kitline-core"]
default-members = [".", "crates/kitline-core"]

[package]
name = "kitline"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Plan a kit landing from a workspace file"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
publish = false

[[bin]]
name = "kitline"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
toml = "0.8"
